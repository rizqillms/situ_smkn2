services:
  - type: web
    name: smkn2-rantau-tu
    runtime: node
    rootDir: smkn2-git
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      # SQLite dan uploads harus berada di persistent disk, bukan filesystem ephemeral.
      - key: DATA_DIR
        value: /var/data
    disk:
      name: situ-data
      mountPath: /var/data
      sizeGB: 1
# Tambahkan BOOTSTRAP_ADMIN_USERNAME dan BOOTSTRAP_ADMIN_PASSWORD melalui dashboard
# Render hanya pada boot pertama, lalu hapus kembali setelah akun admin dibuat.
