<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem TU SMKN 2 Rantau</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --card: rgba(30, 41, 59, 0.8);
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(147, 197, 253, 0.2);
      --radius: 16px;
      --shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #1d4ed8);
    }

    .login-card:hover {
      transform: translateY(-2px);
    }

    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: white;
      font-weight: 800;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      margin: 6px 0 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid rgba(147, 197, 253, 0.3);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      background: rgba(30, 41, 59, 0.5);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: rgba(147, 197, 253, 0.5);
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 253, 0.15);
    }

    input:focus::placeholder {
      color: transparent;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .error.show {
      display: block;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    .hint {
      margin-top: 24px;
      background: rgba(15, 23, 42, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
    }

    .hint b {
      color: #60a5fa;
    }

    .divider {
      height: 1px;
      background: rgba(147, 197, 253, 0.2);
      margin: 20px 0;
    }

    .links {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .links a:hover {
      color: #67e8f9;
    }

    @media (max-width: 420px) {
      .login-card {
        margin: 20px;
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card" id="loginCard">
    <div class="logo">🎓</div>

    <h1>SMKN 2 Rantau</h1>
    <p class="sub">Sistem Informasi Tata Usaha<br>Silakan login untuk melanjutkan</p>

    <div class="error" id="err"></div>

    <form onsubmit="return doLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input id="username" placeholder="Contoh: kasubag" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>

      <button class="btn" type="submit">Masuk →</button>
    </form>

    <div class="divider"></div>

    <div class="hint">
      <b>Catatan:</b> Password minimal 12 karakter. Username sesuai role Anda (<span>admin / kasubag / guru / staff / kepsek</span>).
    </div>

    <div class="links">
      <a href="#" onclick="document.getElementById('username').focus(); return false;">Lupa password?</a>
      <a href="#" onclick="document.getElementById('password').focus(); return false;">Reset</a>
    </div>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Username atau password salah');
        return false;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/';
      return false;
    }

    function showError(msg) {
      const err = document.getElementById('err');
      err.textContent = msg;
      err.classList.add('show');
      setTimeout(() => err.classList.remove('show'), 5000);
    }

    // Auto-focus username
    document.getElementById('username').focus();

    // Check existing token
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }
  </script>
</body>
</html>
