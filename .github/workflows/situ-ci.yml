name: SITU CI

on:
  push:
    branches: [main, hardening/phase-1, 'uiux/**', 'fix/**']
  pull_request:
    branches: [main, hardening/phase-1]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smkn2-git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check backend syntax
        run: node --check server.js
      - name: Check frontend syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          for i, script in enumerate(inline, 1):
              Path(f'/tmp/situ-inline-{i}.js').write_text(script, encoding='utf-8')
          assert 'Lewati navigasi' not in html, 'skip navigation control should be absent'
          assert 'id="absen-form"' in html, 'dedicated attendance form should exist'
          report = html.split('id="laporan"', 1)[1].split('</section>', 1)[0]
          assert 'Dokumentasi kegiatan' in report, 'report documentation label should be present'
          assert 'name="foto"' not in report and 'image/*' not in report, 'report must not accept photo attachments'
          assert 'name="file_laporan"' in report and '.pdf' in report and '.xlsx' in report, 'PDF/Excel report documentation should be accepted'
          print(f'Found {len(inline)} inline script(s) in index.html')
          PY
          for file in /tmp/situ-inline-*.js; do [ -e "$file" ] && node --check "$file"; done
          for file in public/assets/*.js; do node --check "$file"; done
      - name: Smoke test isolated startup and key workflows
        run: |
          tmpdir="$(mktemp -d)"
          PORT=3210 DATA_DIR="$tmpdir" BOOTSTRAP_ADMIN_USERNAME=ci-admin BOOTSTRAP_ADMIN_PASSWORD='ci-only-password-2026' node server.js > "$tmpdir/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$tmpdir"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3210/healthz; then break; fi
            sleep 1
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const base = 'http://127.0.0.1:3210';
          async function call(path, method = 'GET', body, token) {
            const headers = {};
            if (body !== undefined) headers['content-type'] = 'application/json';
            if (token) headers['x-auth-token'] = token;
            const response = await fetch(base + path, {
              method, headers, body: body === undefined ? undefined : JSON.stringify(body)
            });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            return { response, data, raw };
          }
          (async () => {
            const login = await call('/api/login', 'POST', { username: 'ci-admin', password: 'ci-only-password-2026' });
            assert.equal(login.response.status, 200, 'admin login');
            const admin = login.data.token;
            const create = async (nama) => {
              const r = await call('/api/pegawai', 'POST', { nama, status: 'PNS', jenis_pegawai: 'PNS' }, admin);
              assert.equal(r.response.status, 200, 'create synthetic employee');
              return r.data.id;
            };
            const hadirId = await create('CI Hadir');
            const hadir = await call('/api/absensi', 'POST', {
              pegawai_id: hadirId, status: 'Hadir', lat: -2.9317903, lng: 115.1820055
            }, admin);
            assert.equal(hadir.response.status, 200, 'attendance inside official geofence');
            const duplicate = await call('/api/absensi', 'POST', {
              pegawai_id: hadirId, status: 'Hadir', lat: -2.9317903, lng: 115.1820055
            }, admin);
            assert.equal(duplicate.response.status, 409, 'duplicate attendance blocked');

            const outsideId = await create('CI Outside');
            const outside = await call('/api/absensi', 'POST', {
              pegawai_id: outsideId, status: 'Hadir', lat: 0, lng: 0
            }, admin);
            assert.equal(outside.response.status, 403, 'outside geofence blocked');

            const izinId = await create('CI Izin');
            const missingNote = await call('/api/absensi', 'POST', {
              pegawai_id: izinId, status: 'Izin'
            }, admin);
            assert.equal(missingNote.response.status, 400, 'Izin requires a note');
            const izin = await call('/api/absensi', 'POST', {
              pegawai_id: izinId, status: 'Izin', keterangan: 'CI test note'
            }, admin);
            assert.equal(izin.response.status, 200, 'Izin with note accepted');

            const nextPromotion = new Date();
            nextPromotion.setDate(nextPromotion.getDate() + 60);
            const promotion = await call('/api/pegawai', 'POST', {
              nama: 'CI Pangkat', jenis_pegawai: 'PNS', nip: '199001012020011009', golongan: 'III/a',
              periode_tahun: String(nextPromotion.getFullYear() - 4), periode_bulan: String(nextPromotion.getMonth() + 1)
            }, admin);
            assert.equal(promotion.response.status, 200, 'create employee with promotion period');
            const reminders = await call('/api/pegawai/notifikasi', 'GET', undefined, admin);
            assert.equal(reminders.response.status, 200, 'promotion reminders accessible');
            const reminder = reminders.data.find(x => x.nama === 'CI Pangkat');
            assert.ok(reminder, 'scheduled promotion appears in reminders');
            assert.match(reminder.tanggal_naik_berikutnya, /^\d{4}-\d{2}-\d{2}$/, 'reminder date is normalized');
            assert.ok(reminder.sisa_hari >= 0 && reminder.sisa_hari <= 150, 'reminder falls inside the 150-day window');

            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Makassar', year: 'numeric', month: '2-digit'
            }).formatToParts(new Date()).reduce((a, p) => (a[p.type] = p.value, a), {});
            const month = parts.year + '-' + parts.month;
            const report = await call('/api/absensi/rekap?bulan=' + month, 'GET', undefined, admin);
            assert.equal(report.response.status, 200, 'monthly report accessible');
            assert.match(report.data.find(x => x.nama === 'CI Izin').keterangan, /CI test note/, 'monthly note included');

            const form = new FormData();
            form.set('nomor', 'CI-UPLOAD-001');
            form.set('tanggal', '2026-11-10');
            form.set('dari', 'CI');
            form.set('perihal', 'Synthetic upload test');
            form.set('foto', new Blob(['%PDF-1.4\n% synthetic CI PDF fixture\n'], { type: 'application/pdf' }), 'ci-test.pdf');
            const uploadResponse = await fetch(base + '/api/surat-masuk', {
              method: 'POST', headers: { 'x-auth-token': admin }, body: form
            });
            assert.equal(uploadResponse.status, 200, 'authenticated file upload');
            const invalidDateForm = new FormData();
            invalidDateForm.set('nomor', 'CI-INVALID-DATE');
            invalidDateForm.set('tanggal', '2026-02-30');
            invalidDateForm.set('dari', 'CI');
            invalidDateForm.set('perihal', 'Invalid calendar date');
            const invalidDateResponse = await fetch(base + '/api/surat-masuk', {
              method: 'POST', headers: { 'x-auth-token': admin }, body: invalidDateForm
            });
            assert.equal(invalidDateResponse.status, 400, 'impossible calendar date rejected');
            const fakeImageForm = new FormData();
            fakeImageForm.set('nomor', 'CI-FAKE-IMAGE');
            fakeImageForm.set('tanggal', '2026-11-10');
            fakeImageForm.set('dari', 'CI');
            fakeImageForm.set('perihal', 'Mismatched signature');
            fakeImageForm.set('foto', new Blob(['%PDF-1.4\\nnot an image'], { type: 'image/png' }), 'fake.png');
            const fakeImageResponse = await fetch(base + '/api/surat-masuk', {
              method: 'POST', headers: { 'x-auth-token': admin }, body: fakeImageForm
            });
            assert.equal(fakeImageResponse.status, 400, 'file extension and signature mismatch rejected');
            const letters = await call('/api/surat-masuk', 'GET', undefined, admin);
            const uploadedFile = letters.data.find(x => x.nomor === 'CI-UPLOAD-001').foto;
            const anonymousFile = await fetch(base + '/uploads/' + uploadedFile);
            assert.equal(anonymousFile.status, 401, 'uploaded files require authentication');
            const authorizedFile = await fetch(base + '/uploads/' + uploadedFile, { headers: { 'x-auth-token': admin } });
            assert.equal(authorizedFile.status, 200, 'authorized file download');
            assert.match(uploadedFile, /\.pdf$/, 'uploaded file keeps its extension');
            assert.ok((authorizedFile.headers.get('content-type') || '').includes('application/pdf'), 'uploaded PDF served with correct content type');

            const preview = await call('/api/surat-keluar/next-number?jenis=400.3.8&tahun=2026', 'GET', undefined, admin);
            assert.equal(preview.response.status, 200, 'letter number preview accessible');
            assert.match(preview.data.nomor, /^400\.3\.8\/\d{3}\/SMKN2RTU\/2026$/, 'letter number format');
            const outgoing = await call('/api/surat-keluar', 'POST', {
              nomor: 'CI-CLIENT/999', tanggal: '2026-11-10', tujuan: 'CI', perihal: 'CI numbering', jenis: '400.3.8'
            }, admin);
            assert.equal(outgoing.response.status, 200, 'create outgoing letter');
            assert.equal(outgoing.data.nomor, preview.data.nomor, 'server assigns sequence and ignores client number');
            const outgoingPdf = await fetch(base + '/api/surat-keluar/' + outgoing.data.id + '/pdf', { headers: { 'x-auth-token': admin } });
            assert.equal(outgoingPdf.status, 200, 'outgoing letter PDF');
            assert.ok((outgoingPdf.headers.get('content-type') || '').includes('pdf'), 'PDF content type');

            const template = await fetch(base + '/api/pegawai/template', { headers: { 'x-auth-token': admin } });
            assert.equal(template.status, 200, 'employee template download');
            assert.ok((template.headers.get('content-type') || '').includes('spreadsheet'), 'template is an Excel file');
            const ExcelJS = require('exceljs');
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('Data Pegawai');
            sheet.addRow(['Nama Lengkap', 'Jenis Kelamin', 'Tanggal Lahir', 'NIP', 'Status Kepegawaian', 'Jabatan', 'Golongan', 'Periode Tahun', 'Periode Bulan']);
            sheet.addRow(['CI Import', 'Perempuan', '1992-03-15', '199203152020012003', 'PNS', 'Guru CI', 'III/a', 2021, 6]);
            const importForm = new FormData();
            importForm.set('file', new Blob([await workbook.xlsx.writeBuffer()], {
              type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            }), 'ci-import.xlsx');
            const importResponse = await fetch(base + '/api/pegawai/import', {
              method: 'POST', headers: { 'x-auth-token': admin }, body: importForm
            });
            assert.equal(importResponse.status, 200, 'employee import accepted');
            const importResult = await importResponse.json();
            assert.equal(importResult.berhasil, 1, 'one employee imported from Excel');
            const duplicateImport = new FormData();
            duplicateImport.set('file', new Blob([await workbook.xlsx.writeBuffer()], {
              type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            }), 'ci-import.xlsx');
            const duplicateResponse = await fetch(base + '/api/pegawai/import', {
              method: 'POST', headers: { 'x-auth-token': admin }, body: duplicateImport
            });
            assert.equal(duplicateResponse.status, 200, 'duplicate import handled');
            assert.equal((await duplicateResponse.json()).dilewati, 1, 'duplicate employee skipped');

            const backupResponse = await fetch(base + '/api/backup', { headers: { 'x-auth-token': admin } });
            assert.equal(backupResponse.status, 200, 'SQLite and uploads backup');
            assert.ok((backupResponse.headers.get('content-type') || '').includes('application/zip'), 'backup is a ZIP archive');
            const backupBytes = Buffer.from(await backupResponse.arrayBuffer());
            assert.ok(backupBytes.length > 100, 'backup archive is not empty');
            fs.writeFileSync('/tmp/situ-smkn2-ci-backup.zip', backupBytes);

            const makeGuru = await call('/api/users', 'POST', {
              username: 'ci-guru', password: 'ci-guru-password-2026',
              nama: 'CI Guru', role: 'guru', pegawai_id: hadirId
            }, admin);
            assert.equal(makeGuru.response.status, 200, 'create teacher account');
            assert.ok(makeGuru.data.id, 'created account returns its id');
            const guruLogin = await call('/api/login', 'POST', {
              username: 'ci-guru', password: 'ci-guru-password-2026'
            });
            assert.equal(guruLogin.response.status, 200, 'teacher login');
            const guruToken = guruLogin.data.token;
            const ownEmployees = await call('/api/pegawai', 'GET', undefined, guruToken);
            assert.equal(ownEmployees.response.status, 200);
            assert.equal(ownEmployees.data.length, 1, 'teacher sees own employee record only');
            assert.equal(ownEmployees.data[0].alamat, undefined, 'teacher response excludes private address');
            const confidentialLetters = await call('/api/surat-masuk', 'GET', undefined, guruToken);
            assert.equal(confidentialLetters.response.status, 403, 'teacher cannot access office letters');
            const crossAttendance = await call('/api/absensi', 'POST', {
              pegawai_id: outsideId, status: 'Izin', keterangan: 'not mine'
            }, guruToken);
            assert.equal(crossAttendance.response.status, 403, 'teacher cannot mark another employee');

            for (const role of ['staff', 'kepsek']) {
              const ownId = await create('CI Self ' + role);
              const account = await call('/api/users', 'POST', {
                username: 'ci-' + role, password: 'ci-' + role + '-password-2026',
                nama: 'CI ' + role, role, pegawai_id: ownId
              }, admin);
              assert.equal(account.response.status, 200, role + ' account created');
              const roleLogin = await call('/api/login', 'POST', {
                username: 'ci-' + role, password: 'ci-' + role + '-password-2026'
              });
              assert.equal(roleLogin.response.status, 200, role + ' login');
              const selfToken = roleLogin.data.token;
              const selfAttendance = await call('/api/absensi', 'POST', {
                pegawai_id: ownId, status: 'Izin', keterangan: 'self attendance'
              }, selfToken);
              assert.equal(selfAttendance.response.status, 200, role + ' can mark own attendance');
              const otherAttendance = await call('/api/absensi', 'POST', {
                pegawai_id: hadirId, status: 'Izin', keterangan: 'not self'
              }, selfToken);
              assert.equal(otherAttendance.response.status, 403, role + ' cannot mark another employee');
              if (role === 'kepsek') {
                const ownPeople = await call('/api/pegawai', 'GET', undefined, selfToken);
                assert.equal(ownPeople.response.status, 200);
                assert.equal(ownPeople.data.length, 1, 'headmaster sees only linked employee record');
                const ownRows = await call('/api/absensi', 'GET', undefined, selfToken);
                assert.equal(ownRows.response.status, 200);
                assert.equal(ownRows.data.length, 1, 'headmaster attendance view is self-only');
                assert.equal((await call('/api/surat-masuk', 'GET', undefined, selfToken)).response.status, 403);
                assert.equal((await call('/api/surat-keluar', 'GET', undefined, selfToken)).response.status, 403);
                assert.equal((await call('/api/log', 'GET', undefined, selfToken)).response.status, 403);
                assert.equal((await call('/api/absensi/rekap?bulan=2026-11', 'GET', undefined, selfToken)).response.status, 403);
                assert.equal((await call('/api/laporan?bulan=2026-11', 'GET', undefined, selfToken)).response.status, 200);
                const deniedReport = await call('/api/laporan', 'POST', {
                  pegawai_id: ownId, divisi: 'Administrasi Kesiswaan', bulan: '2026-11', kegiatan: 'CI'
                }, selfToken);
                assert.equal(deniedReport.response.status, 403, 'headmaster report submission is read-only');
              }
            }

            const pwAccount = await call('/api/users', 'POST', {
              username: 'ci-pw-user', password: 'ci-old-password-2026',
              nama: 'CI Password User', role: 'guru', pegawai_id: outsideId
            }, admin);
            assert.equal(pwAccount.response.status, 200, 'create password test account');
            const pwLoginA = await call('/api/login', 'POST', {
              username: 'ci-pw-user', password: 'ci-old-password-2026'
            });
            const pwLoginB = await call('/api/login', 'POST', {
              username: 'ci-pw-user', password: 'ci-old-password-2026'
            });
            assert.equal(pwLoginA.response.status, 200);
            assert.equal(pwLoginB.response.status, 200);
            const pwChange = await call('/api/ganti-password', 'POST', {
              lama: 'ci-old-password-2026', baru: 'ci-new-password-2026'
            }, pwLoginA.data.token);
            assert.equal(pwChange.response.status, 200, 'password change accepted');
            assert.equal(pwChange.data.reauth_required, true, 'password change requires reauthentication');
            assert.equal((await call('/api/me', 'GET', undefined, pwLoginA.data.token)).response.status, 401, 'current session revoked');
            assert.equal((await call('/api/me', 'GET', undefined, pwLoginB.data.token)).response.status, 401, 'other device session revoked');
            const pwLoginNew = await call('/api/login', 'POST', {
              username: 'ci-pw-user', password: 'ci-new-password-2026'
            });
            assert.equal(pwLoginNew.response.status, 200, 'new password works after reauthentication');

            await call('/api/logout', 'POST', undefined, admin);
            const expired = await call('/api/me', 'GET', undefined, admin);
            assert.equal(expired.response.status, 401, 'logout invalidates session');
            console.log('Smoke tests passed: auth, role scope, geofence, attendance notes, exports backup.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          unzip -t /tmp/situ-smkn2-ci-backup.zip
          mkdir -p "$tmpdir/restore"
          unzip -q /tmp/situ-smkn2-ci-backup.zip -d "$tmpdir/restore"
          node - "$tmpdir/restore/data.db" "$tmpdir/restore/uploads" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const Database = require('better-sqlite3');
          const db = new Database(process.argv[2], { readonly: true });
          assert.equal(db.pragma('integrity_check', { simple: true }), 'ok', 'restored SQLite integrity');
          const row = db.prepare("SELECT foto FROM surat_masuk WHERE nomor='CI-UPLOAD-001'").get();
          assert.ok(row && row.foto, 'uploaded file reference exists in restored database');
          assert.ok(fs.existsSync(path.join(process.argv[3], row.foto)), 'uploaded file exists in restored uploads folder');
          db.close();
          console.log('Backup restore test passed: database and uploaded file are present.');
          NODE
